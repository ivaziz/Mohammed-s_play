<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>رحلة الأمير محمد توفيق لإنقاذ الأميرة</title>
<style>
  html,body{margin:0;height:100%;background:#0d0d14;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body{position:fixed;inset:0}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;background:#000;box-shadow:0 0 40px #000}
  #touch{position:fixed;inset:0;display:none;pointer-events:none;direction:ltr;z-index:5}
  body.touch #touch{display:block}
  #pad{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:200px;height:96px;border-radius:48px;
    background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.3);pointer-events:auto;display:flex;justify-content:space-between;align-items:center;
    padding:0 26px;box-sizing:border-box;color:rgba(255,255,255,.75);font-size:30px;touch-action:none}
  #pad span.on{color:#ffd23f}
  #btns{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:14px;align-items:flex-end;pointer-events:auto}
  .tb{border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;font-weight:900;display:flex;align-items:center;
    justify-content:center;flex-direction:column;line-height:1.1;touch-action:none;box-sizing:border-box}
  .tb small{font-size:11px;font-weight:700;opacity:.85}
  #bB{width:72px;height:72px;font-size:20px;margin-bottom:46px}
  #bA{width:94px;height:94px;font-size:26px}
  .tb.on{background:rgba(255,210,63,.45)}
  #bP{position:absolute;left:max(12px,env(safe-area-inset-left));top:52px;width:44px;height:44px;font-size:16px;pointer-events:auto}
  #rot{position:fixed;inset:0;display:none;background:#0d0d14;color:#fff;z-index:10;align-items:center;justify-content:center;flex-direction:column;
    font-size:22px;font-weight:800;text-align:center;gap:16px;padding:24px}
  #rot .ph{width:46px;height:80px;border:4px solid #ffd23f;border-radius:10px;animation:rt 1.6s ease-in-out infinite}
  @keyframes rt{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait){ body.touch #rot{display:flex} }
</style>
</head>
<body>
<canvas id="c" width="960" height="512"></canvas>
<div id="touch">
  <div id="pad"><span id="pl">◀</span><span id="pr">▶</span></div>
  <div id="btns"><div class="tb" id="bB">B<small>جري / نار</small></div><div class="tb" id="bA">A<small>قفز</small></div></div>
  <div class="tb" id="bP">❚❚</div>
</div>
<div id="rot"><div class="ph"></div>لف الموبايل بالعرض علشان تلعب</div>
<script>
'use strict';
// ================= Setup =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 512, TS = 32, ROWS = 16;
function fit(){ const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W*s + 'px'; cv.style.height = H*s + 'px'; }
addEventListener('resize', fit); fit();

// ================= Input =================
const keys = {}, pressed = {};
const KEYMAP = {ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',
  ArrowDown:'down',KeyS:'down',KeyX:'run',ShiftLeft:'run',ShiftRight:'run',KeyJ:'run',Enter:'start',KeyP:'pause',Escape:'pause',KeyM:'mute'};
addEventListener('keydown', e => { const k = KEYMAP[e.code]; if(!k) return; e.preventDefault(); if(!keys[k]) pressed[k] = true; keys[k] = true; initAudio(); });
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if(!k) return; keys[k] = false; });
addEventListener('blur', () => { for(const k in keys) keys[k] = false; });
let TOUCH = matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 0;
function setKey(k, v){ if (v && !keys[k]) pressed[k] = true; keys[k] = v; }
let fsTried = false;
function firstTouch(){
  initAudio();
  if (!fsTried) { fsTried = true; try { const d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen;
    if (f) { const r = f.call(d); if (r && r.catch) r.catch(() => {}); } } catch(e) {} }
}
let touchReady = false;
function setupTouch(){
  if (touchReady) return; touchReady = TOUCH = true;
  document.body.classList.add('touch');
  // D-pad: every finger on the pad counts; the far edges mean "run"
  const pad = document.getElementById('pad'), pl = document.getElementById('pl'), pr = document.getElementById('pr');
  const ptrs = new Map(); let padRun = false, bHeld = false;
  const padSync = () => {
    const rc = pad.getBoundingClientRect(), cx = rc.left + rc.width/2; let l = false, r = false; padRun = false;
    for (const x of ptrs.values()) { const dx = x - cx; if (dx < -6) l = true; else if (dx > 6) r = true; if (Math.abs(dx) > rc.width*0.38) padRun = true; }
    setKey('left', l); setKey('right', r); keys.run = padRun || bHeld;
    pl.classList.toggle('on', l); pr.classList.toggle('on', r);
  };
  pad.addEventListener('pointerdown', e => { e.preventDefault(); firstTouch(); try { pad.setPointerCapture(e.pointerId); } catch(_) {} ptrs.set(e.pointerId, e.clientX); padSync(); });
  pad.addEventListener('pointermove', e => { if (ptrs.has(e.pointerId)) { ptrs.set(e.pointerId, e.clientX); padSync(); } });
  const padUp = e => { ptrs.delete(e.pointerId); padSync(); };
  pad.addEventListener('pointerup', padUp); pad.addEventListener('pointercancel', padUp);
  const btn = (id, down, up) => { const el = document.getElementById(id), n = new Set();
    el.addEventListener('pointerdown', e => { e.preventDefault(); firstTouch(); try { el.setPointerCapture(e.pointerId); } catch(_) {} n.add(e.pointerId); el.classList.add('on'); down(); });
    const u = e => { if (!n.delete(e.pointerId)) return; if (!n.size) { el.classList.remove('on'); up(); } };
    el.addEventListener('pointerup', u); el.addEventListener('pointercancel', u); };
  btn('bA', () => { setKey('jump', true); if (!['play','intro','dying','clear'].includes(state)) pressed.start = true; }, () => setKey('jump', false));
  btn('bB', () => { bHeld = true; if (!keys.run) pressed.run = true; keys.run = true; }, () => { bHeld = false; keys.run = padRun; });
  btn('bP', () => { pressed.pause = true; }, () => {});
  // tap anywhere on menus / pause to continue
  cv.addEventListener('pointerdown', e => { e.preventDefault(); firstTouch(); if (!['play','intro','dying','clear'].includes(state)) pressed.start = true; });
  ['gesturestart','dblclick','contextmenu'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  addEventListener('orientationchange', () => setTimeout(fit, 300));
}
if (TOUCH) setupTouch();
addEventListener('touchstart', setupTouch, {once:true, passive:true});
const T_START = () => TOUCH ? 'المس الشاشة للبدء' : 'اضغط Enter أو مسافة للبدء';
const T_BACK = () => TOUCH ? 'المس الشاشة للعودة' : 'اضغط Enter للعودة';
const T_RESUME = () => TOUCH ? 'المس الشاشة للمتابعة' : 'اضغط P أو Enter للمتابعة';
const T_AGAIN = () => TOUCH ? 'المس الشاشة للعب مرة أخرى' : 'اضغط Enter للعب مرة أخرى';

// ================= Audio =================
let AC = null, master = null, muted = false;
function initAudio(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.22; master.connect(AC.destination); } catch(e) {}
}
function tone(f, d, type='square', v=0.3, slide=0, delay=0){
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
}
const seq = (notes, step, type='square', v=0.18) => notes.forEach((f,i) => tone(f, step*1.2, type, v, 0, i*step));
const SFX = {
  jump:  () => tone(280, 0.16, 'square', 0.16, 720),
  coin:  () => { tone(988, 0.06, 'square', 0.16); tone(1319, 0.22, 'square', 0.16, 0, 0.06); },
  stomp: () => tone(420, 0.12, 'square', 0.22, 90),
  bump:  () => tone(130, 0.09, 'triangle', 0.35),
  brk:   () => { tone(220, 0.2, 'sawtooth', 0.2, 50); tone(160, 0.15, 'square', 0.12, 40, 0.03); },
  power: () => seq([523,659,784,1047,1319,1568], 0.055),
  sprout:() => tone(200, 0.45, 'triangle', 0.25, 900),
  hurt:  () => tone(700, 0.45, 'sawtooth', 0.18, 110),
  die:   () => seq([660,520,440,330,262,196,147], 0.12),
  fire:  () => tone(950, 0.08, 'square', 0.12, 300),
  kick:  () => tone(160, 0.12, 'square', 0.22, 480),
  oneup: () => seq([660,784,1319,1047,1175,1568], 0.08),
  spring:() => tone(180, 0.32, 'triangle', 0.3, 1000),
  clear: () => seq([523,659,784,1047,784,1047,1319,1568], 0.13),
  boss:  () => { tone(110, 0.4, 'sawtooth', 0.3, 40); tone(80, 0.5, 'square', 0.2, 30, 0.05); },
  check: () => seq([784,988,1175], 0.07),
  blip:  () => tone(1200, 0.03, 'square', 0.06),
};
// Original chiptune loops (MIDI note numbers, 0 = rest). 32 eighth-note steps of melody, 16 quarter-note bass.
const SONGS = {
  meadow:{bpm:150, mel:[72,0,76,79,77,76,74,0, 72,74,76,72,69,0,67,0, 72,0,76,79,81,79,77,76, 74,76,74,72,74,0,0,0],
          bass:[48,55,52,55,53,57,50,55,48,55,52,55,50,53,55,43]},
  cave:  {bpm:120, mel:[69,0,72,0,76,0,74,72, 71,0,0,72,74,0,0,0, 69,0,72,0,77,0,76,74, 72,0,71,0,69,0,0,0],
          bass:[45,45,52,52,43,43,50,50,41,41,48,48,40,40,47,47]},
  sky:   {bpm:160, mel:[79,0,81,83,84,0,83,81, 79,0,76,0,74,76,79,0, 79,0,81,83,86,0,84,83, 81,79,81,0,83,0,0,0],
          bass:[55,59,62,59,52,55,59,55,53,57,60,57,55,59,62,55]},
  castle:{bpm:132, mel:[57,58,57,0,64,63,64,0, 57,58,57,0,65,64,62,0, 57,58,57,0,64,63,64,0, 69,68,67,66,65,64,63,0],
          bass:[33,33,33,33,34,34,34,34,33,33,33,33,35,35,36,36]},
  boss:  {bpm:176, mel:[69,0,69,72,0,69,75,74, 69,0,69,72,0,69,67,66, 69,0,69,72,0,69,76,75, 74,72,71,69,68,66,65,64],
          bass:[45,45,45,45,46,46,46,46,45,45,45,45,40,40,41,41]},
};
const mus = {song:null, step:0, next:0};
function playSong(name){ mus.song = name ? SONGS[name] : null; mus.step = 0; if (AC) mus.next = AC.currentTime + 0.05; }
function note(m, d, t, type, v){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
}
function musTick(){
  if (!AC || !mus.song || muted) return;
  const s = mus.song, sp = 60 / s.bpm / 2;
  if (mus.next < AC.currentTime - 0.3) mus.next = AC.currentTime + 0.05;
  while (mus.next < AC.currentTime + 0.15) {
    const i = mus.step % 32, m = s.mel[i];
    if (m) note(m, sp * 0.9, mus.next, 'square', 0.055);
    if (i % 2 === 0) { const b = s.bass[(i / 2) % 16]; if (b) note(b, sp * 1.8, mus.next, 'triangle', 0.13); }
    mus.next += sp; mus.step++;
  }
}

// ================= Tiles & themes =================
// 0 empty, 1 ground, 2 brick, 3 gem-block(coin), 4 gem-block(power), 5 used, 6 stone, 7 crystal pillar, 9 lava, 12 coin, 13 gem-block(1up), 14 multi-coin brick
const SOLID = new Uint8Array(32); [1,2,3,4,5,6,7,13,14].forEach(v => SOLID[v] = 1);
const THEMES = {
  meadow:{ground:'#c0743a',groundDark:'#94532a',grass:'#5ccf3c',grassDark:'#3a9a2c',brick:'#c4642c',brickLine:'#6e3214',brickHi:'#e08a52',stone:'#a39a90',plat:'#8a5a2b'},
  cave:  {ground:'#4b5a80',groundDark:'#36405e',grass:'#8fa8d8',grassDark:'#5f74a8',brick:'#3f6fb3',brickLine:'#1f3560',brickHi:'#6d97d6',stone:'#6b7591',plat:'#5b6b94'},
  sky:   {ground:'#f2f6ff',groundDark:'#cfdcf2',grass:'#ffffff',grassDark:'#dbe5f7',brick:'#d9925a',brickLine:'#80451f',brickHi:'#f0b27e',stone:'#c7bfd8',plat:'#ffffff'},
  castle:{ground:'#57525e',groundDark:'#3f3b45',grass:'#77717e',grassDark:'#4a4651',brick:'#7b3d3a',brickLine:'#3a1716',brickHi:'#a45a55',stone:'#6c6672',plat:'#6a5048'},
};
let TH = THEMES.meadow;

// ================= Level builder =================
const BUILD_COLS = 600;
function S(L,x,y,v){ if(x>=0&&x<L.cols&&y>=0&&y<ROWS) L.t[y*L.cols+x] = v; }
function G(L,x,y){ return (x<0||x>=L.cols||y<0||y>=ROWS) ? 0 : L.t[y*L.cols+x]; }
function fillR(L,x0,y0,x1,y1,v){ for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) S(L,x,y,v); }
function ground(L,x,n){ fillR(L,x,14,x+n-1,15,1); }
function pit(L,x,n){ fillR(L,x,14,x+n-1,15, L.theme==='castle' ? 9 : 0); }
function coinsRow(L,x,y,n){ for(let i=0;i<n;i++) S(L,x+i,y,12); }
function pillar(L,x,h){ fillR(L,x,14-h,x+1,13,7); }
function ent(L,type,tx,ty,o={}){ L.ents.push(Object.assign({type,tx,ty},o)); }

const SEC = {
  start(L,x){ ground(L,x,14); S(L,x+8,10,4); coinsRow(L,x+10,10,2); return 14; },
  flat(L,x,n=6){ ground(L,x,n); return n; },
  blocks(L,x){
    ground(L,x,16);
    S(L,x+3,10,3); S(L,x+7,10,2); S(L,x+8,10,4); S(L,x+9,10,2); S(L,x+10,10,3); S(L,x+11,10,2); S(L,x+9,6,3);
    ent(L,'walker',x+13,13); ent(L,'walker',x+15,13); return 16;
  },
  blocks2(L,x){
    ground(L,x,16);
    fillR(L,x+4,10,x+8,10,2); S(L,x+6,10,14); coinsRow(L,x+4,9,2); coinsRow(L,x+7,9,2);
    S(L,x+12,10,3); S(L,x+12,6,13);
    ent(L,'hopper',x+10,13); ent(L,'walker',x+14,13); return 16;
  },
  pillars(L,x){
    ground(L,x,20); pillar(L,x+3,2); pillar(L,x+9,3); pillar(L,x+15,4);
    coinsRow(L,x+9,9,2); coinsRow(L,x+15,8,2);
    ent(L,'walker',x+7,13); ent(L,'walker',x+12,13); ent(L,'walker',x+13,13); return 20;
  },
  gap(L,x,n=3){ pit(L,x,n); for(let i=0;i<n;i++) S(L,x+i,10-Math.round(Math.sin(Math.PI*(i+0.5)/n)*2),12); return n; },
  stairs(L,x){
    ground(L,x,18);
    for(let i=0;i<4;i++) fillR(L,x+2+i,13-i,x+2+i,13,6);
    pit(L,x+6,2);
    for(let i=0;i<4;i++) fillR(L,x+8+i,10+i,x+8+i,13,6);
    ent(L,'walker',x+14,13); ent(L,'walker',x+16,13); return 18;
  },
  floating(L,x){
    ground(L,x,3); pit(L,x+3,14);
    fillR(L,x+4,11,x+7,11,2); fillR(L,x+9,8,x+12,8,2); fillR(L,x+13,11,x+15,11,2);
    S(L,x+10,4,3); coinsRow(L,x+4,10,4); coinsRow(L,x+9,7,4);
    ent(L,'flyer',x+11,5);
    ground(L,x+17,3); return 20;
  },
  enemyRun(L,x){
    ground(L,x,18); coinsRow(L,x+5,10,4); S(L,x+11,10,3);
    ent(L,'walker',x+6,13); ent(L,'walker',x+8,13); ent(L,'hopper',x+12,13); ent(L,'walker',x+15,13); return 18;
  },
  spiky(L,x){
    ground(L,x,18); fillR(L,x+4,10,x+12,10,2); S(L,x+8,10,4); coinsRow(L,x+5,9,3); coinsRow(L,x+10,9,3);
    ent(L,'spiky',x+6,13); ent(L,'spiky',x+11,13); ent(L,'walker',x+15,13); return 18;
  },
  spring(L,x){
    ground(L,x,16); ent(L,'spring',x+4,13); fillR(L,x+7,7,x+8,13,6); coinsRow(L,x+4,4,6); return 16;
  },
  movingPlats(L,x){
    ground(L,x,2); pit(L,x+2,16);
    ent(L,'plat',x+4,11,{ax:'x',range:64,speed:0.02});
    ent(L,'plat',x+9,9,{ax:'y',range:64,speed:0.025});
    ent(L,'plat',x+14,11,{ax:'x',range:48,speed:0.03});
    coinsRow(L,x+9,5,3);
    ground(L,x+18,3); return 21;
  },
  batCave(L,x){
    ground(L,x,18); coinsRow(L,x+4,12,10); S(L,x+9,10,3);
    ent(L,'flyer',x+6,9); ent(L,'flyer',x+13,8); ent(L,'walker',x+16,13); return 18;
  },
  firebar(L,x){
    ground(L,x,18);
    S(L,x+5,11,6); ent(L,'firebar',x+5,11,{len:6,sp:0.045});
    S(L,x+12,9,6); ent(L,'firebar',x+12,9,{len:6,sp:-0.04});
    S(L,x+9,6,3); ent(L,'spiky',x+16,13); return 18;
  },
  lavaPit(L,x){
    ground(L,x,2); pit(L,x+2,14);
    fillR(L,x+5,11,x+5,15,6); fillR(L,x+9,10,x+10,15,6); fillR(L,x+13,12,x+13,15,6);
    coinsRow(L,x+9,8,2); ent(L,'flyer',x+11,6);
    ground(L,x+16,2); return 18;
  },
  checkpoint(L,x){ L.check = x; ground(L,x,4); ent(L,'flagc',x+2,13); return 4; },
  goal(L,x){
    ground(L,x,30);
    for(let i=0;i<8;i++) fillR(L,x+2+i,13-i,x+2+i,13,6);
    ent(L,'goal',x+14,3);
    L.castleX = (x+18)*TS; return 30;
  },
  bossArena(L,x){
    ground(L,x,30);
    fillR(L,x,2,x,10,6); fillR(L,x+29,1,x+29,13,6);
    S(L,x+4,10,4);
    fillR(L,x+9,10,x+11,10,6); fillR(L,x+18,10,x+20,10,6);
    L.arena = {x0:x*TS, x1:(x+29)*TS};
    ent(L,'boss',x+23,11); return 30;
  },
};

const LEVELS = [
  {name:'\u20661-1\u2069  المروج الخضراء', theme:'meadow', time:200,
   secs:['start','blocks','flat:4','pillars','gap:3','enemyRun','blocks2','floating','checkpoint','stairs','gap:3','spiky','enemyRun','blocks','gap:2','pillars','spring','flat:4','goal']},
  {name:'\u20661-2\u2069  كهف البلّور', theme:'cave', time:200,
   secs:['start','batCave','blocks','gap:2','pillars','spiky','floating','checkpoint','enemyRun','batCave','stairs','gap:4','blocks2','spiky','gap:3','enemyRun','spring','goal']},
  {name:'\u20661-3\u2069  جزر السحاب', theme:'sky', time:200,
   secs:['start','floating','movingPlats','enemyRun','gap:3','floating','checkpoint','movingPlats','spring','floating','enemyRun','movingPlats','floating','stairs','goal']},
  {name:'\u20661-4\u2069  قلعة البركان', theme:'castle', time:220,
   secs:['start','firebar','lavaPit','spiky','firebar','checkpoint','movingPlats','lavaPit','enemyRun','firebar','spiky','firebar','flat:3','bossArena']},
];

function buildLevel(idx){
  const def = LEVELS[idx];
  const L = {cols:BUILD_COLS, theme:def.theme, name:def.name, time:def.time, t:new Uint8Array(BUILD_COLS*ROWS), ents:[], check:null, arena:null, castleX:null, multi:{}};
  let x = 0;
  for (const s of def.secs) { const [n,a] = s.split(':'); x += SEC[n](L, x, a ? +a : undefined); }
  const t = new Uint8Array(x*ROWS);
  for (let y=0;y<ROWS;y++) for (let i=0;i<x;i++) t[y*x+i] = L.t[y*BUILD_COLS+i];
  L.cols = x; L.t = t;
  if (def.theme === 'cave') fillR(L,0,0,x-1,1,1);
  if (def.theme === 'castle') fillR(L,0,0,x-1,0,6);
  return L;
}

// ================= Game state =================
let state = 'title', L = null, levelIdx = 0, P = null, ents = [], fbs = [], parts = [], floats = [], bumps = [];
let camX = 0, score = 0, coins = 0, lives = 3, time = 0, timeFrames = 0, frame = 0, stateT = 0;
let reachedCheck = false, combo = 0, clearPhase = 0, goalEnt = null, pSize = 0, shake = 0, bossRef = null;

function newGame(){ score = 0; coins = 0; lives = 3; pSize = 0; loadLevel(0, false); }

function spawn(s){
  const x = s.tx*TS, y = s.ty*TS, b = (s.ty+1)*TS;
  const base = {type:s.type, state:'alive', vx:0, vy:0, dormant:false};
  switch (s.type) {
    case 'walker': return {...base, x:x+2, y:b-26, w:28, h:26, dir:-1, spd:1, dormant:true};
    case 'spiky':  return {...base, x:x+2, y:b-26, w:28, h:26, dir:-1, spd:0.8, dormant:true};
    case 'hopper': return {...base, x:x+3, y:b-24, w:26, h:24, timer:60, dir:-1, dormant:true};
    case 'flyer':  return {...base, x, y, w:28, h:20, bx:x, by:y, t:0, dormant:true};
    case 'spring': return {...base, x, y:b-32, w:32, h:32, comp:0};
    case 'plat':   return {...base, x, y, bx:x, by:y, w:96, h:16, ax:s.ax, range:s.range, speed:s.speed, t:0, dx:0, dy:0};
    case 'firebar':return {...base, cx:x+16, cy:y+16, len:s.len, sp:s.sp, a:0, x, y, w:32, h:32};
    case 'goal':   return {...base, x:x+13, y, w:6, h:14*TS-y, flagY:y+16};
    case 'flagc':  return {...base, x:x+8, y:b-64, w:16, h:64, got:false};
    case 'boss':   return {...base, x, y:14*TS-80, w:72, h:80, dir:-1, hp:5, inv:0, timer:90, face:-1, dormant:true};
  }
  return null;
}

function loadLevel(idx, fromCheck){
  L = buildLevel(idx); levelIdx = idx; TH = THEMES[L.theme];
  const useCheck = fromCheck && L.check != null;
  const sx = useCheck ? (L.check+1)*TS : 3*TS;
  P = {x:sx, y:14*TS-28, w:22, h:28, vx:0, vy:0, face:1, size:0, onGround:false, inv:0, coyote:0, jbuf:0, anim:0, onPlat:null, growT:0, hidden:false};
  if (pSize > 0) { P.size = pSize; P.h = 54; P.y = 14*TS-54; }
  camX = Math.max(0, Math.min(P.x - W*0.4, L.cols*TS - W));
  ents = L.ents.map(spawn).filter(e => e && !(e.x < camX - 32 && e.type !== 'plat'));
  if (useCheck) ents.forEach(e => { if (e.type === 'flagc') e.got = true; });
  fbs = []; parts = []; floats = []; bumps = [];
  time = L.time; timeFrames = 0; combo = 0; reachedCheck = useCheck; goalEnt = null; shake = 0;
  bossRef = ents.find(e => e.type === 'boss') || null;
  state = 'intro'; stateT = 130; playSong(null);
}

// ================= Physics =================
function solidAt(tx,ty){ if (tx<0 || tx>=L.cols) return true; if (ty<0 || ty>=ROWS) return false; return SOLID[L.t[ty*L.cols+tx]] === 1; }
function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function moveBody(b){
  b.onGround = false; b.hitWall = 0; b.hitHead = null;
  b.x += b.vx;
  const y0 = Math.floor(b.y/TS), y1 = Math.floor((b.y+b.h-1)/TS);
  if (b.vx > 0) {
    const tx = Math.floor((b.x+b.w)/TS);
    for (let ty=y0; ty<=y1; ty++) if (solidAt(tx,ty)) { b.x = tx*TS - b.w; b.vx = 0; b.hitWall = 1; break; }
  } else if (b.vx < 0) {
    const tx = Math.floor(b.x/TS);
    for (let ty=y0; ty<=y1; ty++) if (solidAt(tx,ty)) { b.x = (tx+1)*TS; b.vx = 0; b.hitWall = -1; break; }
  }
  b.y += b.vy;
  const x0 = Math.floor(b.x/TS), x1 = Math.floor((b.x+b.w-1)/TS);
  if (b.vy > 0) {
    const ty = Math.floor((b.y+b.h)/TS);
    for (let tx=x0; tx<=x1; tx++) if (solidAt(tx,ty) && ty>=0) { b.y = ty*TS - b.h; b.vy = 0; b.onGround = true; break; }
  } else if (b.vy < 0) {
    const ty = Math.floor(b.y/TS); let hit = null; const cx = b.x + b.w/2;
    for (let tx=x0; tx<=x1; tx++) if (ty>=0 && solidAt(tx,ty)) {
      if (!hit || Math.abs(tx*TS+16-cx) < Math.abs(hit.tx*TS+16-cx)) hit = {tx,ty};
    }
    if (hit) {
      // corner forgiveness: nudge the player around a block edge instead of bonking
      if (b === P && x0 !== x1 && Math.abs(hit.tx*TS+16-cx) > 22) {
        const other = hit.tx === x0 ? x1 : x0;
        if (!solidAt(other,ty)) { b.x = hit.tx === x0 ? (x0+1)*TS : x1*TS - b.w; return; }
      }
      b.y = (ty+1)*TS; b.vy = 0; b.hitHead = hit;
    }
  }
}

// ================= Helpers =================
function addScore(n, x, y){ score += n; if (x !== undefined) floats.push({x, y, text:String(n), life:50}); }
function addCoin(){ coins++; score += 200; SFX.coin(); if (coins >= 100) { coins -= 100; lives++; SFX.oneup(); floats.push({x:P.x, y:P.y-10, text:'1UP', life:60}); } }
function puff(x,y,n=6,col='#fff'){ for (let i=0;i<n;i++) parts.push({x, y, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3, g:0, life:20+Math.random()*10, col, size:3+Math.random()*3}); }
const STOMPABLE = {walker:1, hopper:1, flyer:1};
const ENEMY = {walker:1, hopper:1, flyer:1, spiky:1};

function setSize(s){
  if (s > 0 && P.size === 0) { P.y -= 26; P.h = 54; P.growT = 40; }
  if (s === 0 && P.size > 0) { P.y += 26; P.h = 28; }
  P.size = s; pSize = s;
}
function hurt(){
  if (P.inv > 0 || state !== 'play') return;
  if (P.size > 0) { setSize(0); P.inv = 120; SFX.hurt(); }
  else die();
}
function die(){
  if (state !== 'play') return;
  state = 'dying'; stateT = 170; P.vy = -10; P.vx = 0; pSize = 0; playSong(null); SFX.die();
}
function kill(e, how){
  if (how === 'stomp') { e.state = 'squash'; e.t = 30; }
  else { e.state = 'flip'; e.vy = -6; e.vx = (P.x < e.x ? 1.5 : -1.5); }
}
function comboScore(){ const t = [100,200,400,800,1000,2000,4000,8000]; return t[Math.min(combo++, t.length-1)]; }

function hitBlock(tx, ty){
  const v = G(L,tx,ty), key = tx + ',' + ty;
  // kill enemies standing on top of the block
  for (const e of ents) if (ENEMY[e.type] && e.state === 'alive' && !e.dormant &&
      e.x+e.w > tx*TS && e.x < tx*TS+TS && Math.abs(e.y+e.h - ty*TS) < 6) { kill(e,'flip'); addScore(100, e.x, e.y); SFX.kick(); }
  if (v === 3) { S(L,tx,ty,5); coinPop(tx,ty); }
  else if (v === 4) { S(L,tx,ty,5); SFX.sprout(); ents.push(P.size === 0
      ? {type:'fruit', state:'alive', x:tx*TS+4, y:ty*TS, w:24, h:24, vx:0, vy:0, dir:1, rise:28}
      : {type:'flame', state:'alive', x:tx*TS+4, y:ty*TS, w:24, h:28, vx:0, vy:0, rise:30}); }
  else if (v === 13) { S(L,tx,ty,5); SFX.sprout(); ents.push({type:'heart', state:'alive', x:tx*TS+4, y:ty*TS, w:24, h:22, vx:0, vy:0, dir:1, rise:26}); }
  else if (v === 14) { L.multi[key] = (L.multi[key] ?? 8) - 1; coinPop(tx,ty); if (L.multi[key] <= 0) S(L,tx,ty,5); }
  else if (v === 2) {
    if (P.size > 0) {
      S(L,tx,ty,0); SFX.brk(); addScore(50);
      for (let i=0;i<4;i++) parts.push({x:tx*TS+8+(i%2)*16, y:ty*TS+8+(i>>1)*16, vx:(i%2?2.2:-2.2), vy:(i>>1?-5:-9), g:0.5, life:60, col:TH.brick, size:10, rot:true});
      return;
    } else SFX.bump();
  } else SFX.bump();
  bumps.push({tx, ty, t:0});
}
function coinPop(tx,ty){ coins++; score += 200; SFX.coin(); if (coins >= 100) { coins -= 100; lives++; SFX.oneup(); }
  parts.push({kind:'coin', x:tx*TS+16, y:ty*TS-8, vx:0, vy:-10, g:0.75, life:24, onEnd:() => floats.push({x:tx*TS+4, y:ty*TS-40, text:'200', life:40})}); }

// ================= Update =================
function update(){
  frame++;
  if (pressed.mute) { muted = !muted; if (!muted && AC) mus.next = AC.currentTime + 0.05; }
  switch (state) {
    case 'title': if (pressed.start || pressed.jump) newGame(); break;
    case 'intro': if (--stateT <= 0) { state = 'play'; playSong(L.theme); } break;
    case 'play':
      if (pressed.pause || pressed.start) { state = 'paused'; playSong(null); break; }
      updatePlay(); break;
    case 'paused': if (pressed.pause || pressed.start) { state = 'play'; playSong(bossRef && !bossRef.dormant ? 'boss' : L.theme); } break;
    case 'dying': updateDying(); break;
    case 'clear': updateClear(); break;
    case 'gameover': case 'win':
      if (stateT > 0) stateT--; else if (pressed.start || pressed.jump) state = 'title';
      updateParts(); break;
  }
  if (shake > 0) shake--;
  for (const k in pressed) delete pressed[k];
}

function updatePlay(){
  if (++timeFrames >= 60) { timeFrames = 0; time--; if (time === 60) seq([880,1100,880,1100],0.08); if (time <= 0) { time = 0; die(); return; } }
  for (const p of ents) if (p.type === 'plat') {
    p.t += p.speed; const ox = p.x, oy = p.y;
    p.x = p.bx + (p.ax === 'x' ? Math.sin(p.t)*p.range : 0);
    p.y = p.by + (p.ax === 'y' ? Math.sin(p.t)*p.range : 0);
    p.dx = p.x - ox; p.dy = p.y - oy;
  }
  updatePlayer(); if (state !== 'play') return;
  updateEnts(); if (state !== 'play' && state !== 'win') return;
  updateFbs(); updateParts();
  camX = Math.max(camX, Math.min(P.x - W*0.4, L.cols*TS - W));
  if (P.x < camX) { P.x = camX; if (P.vx < 0) P.vx = 0; }
  if (L.check != null && !reachedCheck && P.x > L.check*TS + 32) {
    reachedCheck = true; SFX.check(); const f = ents.find(e => e.type === 'flagc'); if (f) f.got = true;
  }
  bumps = bumps.filter(b => ++b.t < 10);
}

function updatePlayer(){
  if (P.inv > 0) P.inv--; if (P.growT > 0) P.growT--;
  if (P.onPlat) { const p = P.onPlat; P.x += p.dx; P.y = p.y - P.h; }
  const run = keys.run, maxV = run ? 5.4 : 3.2;
  const ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (ax) {
    let acc = P.onGround ? (run ? 0.3 : 0.22) : 0.2;
    if (P.vx*ax < 0 && P.onGround) acc += 0.35;
    P.vx += ax*acc; P.face = ax;
  } else if (P.onGround) { P.vx *= 0.8; if (Math.abs(P.vx) < 0.08) P.vx = 0; }
  if (Math.abs(P.vx) > maxV) P.vx = Math.sign(P.vx) * Math.max(maxV, Math.abs(P.vx) - 0.25);
  if (pressed.jump) P.jbuf = 8; else if (P.jbuf > 0) P.jbuf--;
  if (P.onGround) P.coyote = 6; else if (P.coyote > 0) P.coyote--;
  if (P.jbuf > 0 && P.coyote > 0) { P.vy = -(10 + Math.abs(P.vx)*0.28); P.jbuf = 0; P.coyote = 0; P.onPlat = null; SFX.jump(); }
  if (P.springT > 0) P.springT--;
  P.vy = Math.min(P.vy + (((keys.jump || P.springT > 0) && P.vy < 0) ? 0.36 : 0.8), 11);
  if (pressed.run && P.size === 2 && fbs.length < 2) {
    fbs.push({x:P.face > 0 ? P.x+P.w : P.x-10, y:P.y+12, w:10, h:10, vx:P.face*7.5, vy:2, spin:0}); SFX.fire();
  }
  const prevB = P.y + P.h;
  moveBody(P);
  if (P.hitHead) hitBlock(P.hitHead.tx, P.hitHead.ty);
  P.onPlat = null;
  for (const p of ents) if (p.type === 'plat') {
    if (P.vy >= 0 && prevB <= p.y - p.dy + 6 && P.y + P.h >= p.y && P.x + P.w > p.x + 2 && P.x < p.x + p.w - 2) {
      P.y = p.y - P.h; P.vy = 0; P.onGround = true; P.onPlat = p;
    }
  }
  if (P.onGround) combo = 0;
  P.anim += Math.abs(P.vx);
  // tiles overlapped: coins & lava
  const x0 = Math.floor(P.x/TS), x1 = Math.floor((P.x+P.w-1)/TS), y0 = Math.floor(P.y/TS), y1 = Math.floor((P.y+P.h-1)/TS);
  for (let ty=y0; ty<=y1; ty++) for (let tx=x0; tx<=x1; tx++) {
    const v = G(L,tx,ty);
    if (v === 12) { S(L,tx,ty,0); addCoin(); }
    else if (v === 9 && P.y + P.h > ty*TS + 6) { die(); return; }
  }
  if (P.y > ROWS*TS + 40) { die(); return; }
  for (const g of ents) if (g.type === 'goal' && P.x + P.w >= g.x) { startClear(g); return; }
}

function updateEnts(){
  for (const e of ents) {
    if (e.dead) continue;
    if (e.dormant) {
      if (e.type === 'boss') { if (L.arena && camX >= L.arena.x0 - 2) { e.dormant = false; playSong('boss'); SFX.boss(); shake = 20; } else continue; }
      else if (e.x < camX + W + 40) e.dormant = false; else continue;
    }
    if (e.state === 'squash') { if (--e.t <= 0) e.dead = true; continue; }
    if (e.state === 'flip') { e.vy += 0.5; e.x += e.vx; e.y += e.vy; if (e.y > H + 64) e.dead = true; continue; }
    switch (e.type) {
      case 'walker': case 'spiky':
        e.vx = e.dir*e.spd; e.vy = Math.min(e.vy + 0.5, 10); moveBody(e);
        if (e.hitWall) e.dir *= -1;
        else if (e.type === 'spiky' && e.onGround) {
          const ax = e.dir > 0 ? e.x + e.w + 1 : e.x - 1;
          if (!solidAt(Math.floor(ax/TS), Math.floor((e.y+e.h+2)/TS))) e.dir *= -1;
        }
        break;
      case 'hopper':
        e.vy = Math.min(e.vy + 0.45, 10); moveBody(e);
        if (e.onGround) { e.vx *= 0.7; if (--e.timer <= 0) { e.vy = -9; e.dir = P.x < e.x ? -1 : 1; e.vx = e.dir*1.8; e.timer = 80; } }
        break;
      case 'flyer': e.t++; e.x = e.bx + Math.sin(e.t*0.02)*64; e.y = e.by + Math.sin(e.t*0.06)*28; e.dir = Math.cos(e.t*0.02) >= 0 ? 1 : -1; break;
      case 'fruit': case 'heart':
        if (e.rise > 0) { e.rise--; e.y -= 1; break; }
        e.vx = e.dir*1.8; e.vy = Math.min(e.vy + 0.5, 10); moveBody(e); if (e.hitWall) e.dir *= -1; break;
      case 'flame': if (e.rise > 0) { e.rise--; e.y -= 1; } break;
      case 'firebar':
        e.a += e.sp;
        if (P.inv <= 0) for (let i=1;i<e.len;i++) {
          const bx = e.cx + Math.cos(e.a)*i*14, by = e.cy + Math.sin(e.a)*i*14;
          const nx = Math.max(P.x, Math.min(bx, P.x+P.w)), ny = Math.max(P.y, Math.min(by, P.y+P.h));
          if ((nx-bx)**2 + (ny-by)**2 < 36) { hurt(); break; }
        }
        break;
      case 'spring': if (e.comp > 0) e.comp--; break;
      case 'efire': e.vy += 0.3; e.x += e.vx; e.y += e.vy; if (e.y > H + 40) e.dead = true; break;
      case 'boss': updateBoss(e); continue;
    }
    if (ENEMY[e.type] && (e.y > ROWS*TS + 64 || e.x + e.w < camX - 120)) e.dead = true;
    if (e.type === 'fruit' || e.type === 'heart') if (e.y > ROWS*TS + 64) e.dead = true;
    if (state === 'play' && !e.dead && e.state === 'alive') interact(e);
    if (state !== 'play') break;
  }
  ents = ents.filter(e => !e.dead);
}

function interact(e){
  const hb = e.type === 'spring' ? {x:e.x+2, y:e.y+(e.comp?14:4), w:28, h:28} : e;
  if (!overlap(P, hb)) return;
  switch (e.type) {
    case 'walker': case 'hopper': case 'flyer':
      if (P.vy > 0 && (P.y + P.h) - e.y < 14 + P.vy) {
        kill(e, 'stomp'); P.vy = keys.jump ? -11 : -7; P.onGround = false; addScore(comboScore(), e.x, e.y - 10); SFX.stomp();
      } else hurt();
      break;
    case 'spiky': case 'efire': hurt(); break;
    case 'fruit': e.dead = true; if (P.size === 0) setSize(1); addScore(1000, e.x, e.y); SFX.power(); break;
    case 'flame': e.dead = true; if (P.size === 0) setSize(1); setSize(2); P.growT = 40; addScore(1000, e.x, e.y); SFX.power(); break;
    case 'heart': e.dead = true; lives++; SFX.oneup(); floats.push({x:e.x, y:e.y-10, text:'1UP', life:60}); break;
    case 'spring':
      if (P.vy >= 0 && e.comp === 0) { P.y = e.y + 14 - P.h; P.vy = keys.jump ? -17 : -16; P.springT = 40; e.comp = 14; P.onGround = false; P.onPlat = null; SFX.spring(); }
      break;
  }
}

function damageBoss(e){
  e.hp--; e.inv = 50; SFX.boss(); shake = 12; addScore(500, e.x + 20, e.y - 10); puff(e.x+e.w/2, e.y+20, 10, '#ffd36b');
  if (e.hp <= 0) { e.state = 'dead'; e.vy = -9; e.vx = e.face * -1.5; e.t = 150; addScore(5000, e.x, e.y - 30); playSong(null); }
}
function updateBoss(e){
  if (e.state === 'dead') {
    e.vy += 0.4; e.y += e.vy; e.x += e.vx;
    if (frame % 6 === 0) puff(e.x + Math.random()*e.w, e.y + Math.random()*e.h, 4, '#ff9a3c');
    if (--e.t <= 0 && state === 'play') {
      score += time*50; state = 'win'; stateT = 90; SFX.clear(); e.dead = true;
    }
    return;
  }
  if (e.inv > 0) e.inv--;
  const spd = 1.2 + (5 - e.hp)*0.35;
  e.face = P.x + P.w/2 < e.x + e.w/2 ? -1 : 1;
  e.vx = e.dir*spd; e.vy = Math.min(e.vy + 0.5, 12); moveBody(e);
  if (e.hitWall) e.dir *= -1;
  if (L.arena && e.x < L.arena.x0 + TS) { e.x = L.arena.x0 + TS; e.dir = 1; }
  if (e.onGround && --e.timer <= 0) {
    if (Math.random() < 0.45) { e.vy = -12.5; shake = 6; }
    else {
      const n = e.hp <= 2 ? 3 : e.hp <= 4 ? 2 : 1;
      for (let k=0;k<n;k++) ents.push({type:'efire', state:'alive', x:e.x+e.w/2-7, y:e.y+18, w:14, h:14, vx:e.face*(2.5+k*1.6), vy:-7-k, dormant:false});
      SFX.fire();
    }
    e.timer = Math.max(40, 80 + Math.random()*60 - (5 - e.hp)*10);
  }
  if (state === 'play' && overlap(P, e)) {
    if (P.vy > 0 && P.y + P.h - e.y < 20 + P.vy) { P.vy = -11; P.y = e.y - P.h; SFX.stomp(); if (e.inv <= 0) damageBoss(e); }
    else hurt();
  }
}

function updateFbs(){
  for (const f of fbs) {
    f.vy = Math.min(f.vy + 0.45, 9); moveBody(f); f.spin += 0.4;
    if (f.onGround) f.vy = -5.5;
    if (f.hitWall || f.x < camX - 20 || f.x > camX + W + 20 || f.y > H) { f.dead = true; if (f.hitWall) puff(f.x+5, f.y+5, 5, '#ffb347'); continue; }
    for (const e of ents) {
      if (e.dormant || e.state !== 'alive') continue;
      if (ENEMY[e.type] && overlap(f, e)) { kill(e, 'flip'); f.dead = true; addScore(200, e.x, e.y); SFX.kick(); puff(f.x, f.y, 5, '#ffb347'); break; }
      if (e.type === 'boss' && overlap(f, e)) { f.dead = true; puff(f.x, f.y, 5, '#ffb347'); if (e.inv <= 0) damageBoss(e); break; }
    }
  }
  fbs = fbs.filter(f => !f.dead);
}
function updateParts(){
  for (const p of parts) { p.vy += p.g; p.x += p.vx; p.y += p.vy; if (--p.life <= 0 && p.onEnd) p.onEnd(); }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 0.8; f.life--; }
  floats = floats.filter(f => f.life > 0);
}

function updateDying(){
  if (stateT < 140) { P.vy += 0.45; P.y += P.vy; }
  updateParts();
  if (--stateT <= 0) {
    lives--;
    if (lives <= 0) { state = 'gameover'; stateT = 60; }
    else loadLevel(levelIdx, reachedCheck);
  }
}

function startClear(g){
  state = 'clear'; clearPhase = 0; stateT = 0; goalEnt = g;
  P.vx = 0; P.vy = 0; P.x = g.x - P.w + 4; P.face = 1;
  const ht = 14*TS - (P.y + P.h);
  const pts = ht > 300 ? 5000 : ht > 220 ? 2000 : ht > 140 ? 800 : ht > 60 ? 400 : 100;
  addScore(pts, P.x + 30, P.y); playSong(null); SFX.clear();
}
function updateClear(){
  const g = goalEnt;
  if (clearPhase === 0) {
    P.y = Math.min(P.y + 4, 14*TS - P.h); g.flagY = Math.min(g.flagY + 4, 14*TS - 40);
    if (P.y >= 14*TS - P.h && g.flagY >= 14*TS - 40) { clearPhase = 1; P.x = g.x + 8; }
  } else if (clearPhase === 1) {
    P.vx = 2.2; P.vy = Math.min(P.vy + 0.8, 11); moveBody(P); P.anim += 2.2;
    if (P.x > L.castleX + 2.5*TS - 10) { P.hidden = true; clearPhase = 2; stateT = 0; }
  } else {
    if (time > 0) { const d = Math.min(time, 2); time -= d; score += d*50; if (frame % 3 === 0) SFX.blip(); }
    else if (++stateT > 70) {
      if (levelIdx + 1 < LEVELS.length) loadLevel(levelIdx + 1, false);
      else { state = 'win'; stateT = 90; }
    }
  }
  camX = Math.max(camX, Math.min(P.x - W*0.4, L.cols*TS - W));
  updateParts();
}

function rect(x,y,w,h,c){ ctx.fillStyle = c; ctx.fillRect(x,y,w,h); }
function circ(x,y,r,c){ ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function ell(x,y,rx,ry,c){ ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x,y,Math.max(rx,0.1),Math.max(ry,0.1),0,0,Math.PI*2); ctx.fill(); }
function tri(a,b,c,d,e,f,col){ ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(c,d); ctx.lineTo(e,f); ctx.closePath(); ctx.fill(); }
function hash(x,y){ let h = (x*374761393 + y*668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return (h ^ (h >>> 16)) >>> 0; }
function txt(s, x, y, size, col='#fff', align='center', stroke='#000'){
  ctx.font = `900 ${size}px system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.direction = 'rtl';
  ctx.lineWidth = Math.max(3, size/6); ctx.strokeStyle = stroke; ctx.lineJoin = 'round';
  ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
}

function drawBG(theme, cx){

    for (let i=-1;i<5;i++) { const x = ((i*300 - cx*0.15) % 1500 + 1500) % 1500 - 200, y = 60 + (i*53 % 70);
      ell(x,y,46,18,'#fff'); ell(x+30,y-12,30,20,'#fff'); ell(x-28,y-6,26,14,'#fff'); }
    hills(cx*0.25, 330, 60, '#8fd16a', 0.004); hills(cx*0.5, 380, 40, '#5fb84a', 0.009);
  } else if (theme === 'cave') {
    g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#070a1a'); g.addColorStop(1,'#1d2547'); rect(0,0,W,H,g);
    for (let i=0;i<14;i++) { const x = ((i*97 - cx*0.3) % 1350 + 1350) % 1350 - 100, h = 40 + (i*37 % 80);
      tri(x-22,0,x+22,0,x,h,'#141b38'); tri(x+40,H,x+80,H,x+60,H-h-30,'#141b38'); }
    for (let i=0;i<30;i++) { const x = ((i*151 - cx*0.15) % 1100 + 1100) % 1100 - 70, y = 70 + (i*89 % 300);
      const a = 0.4 + 0.4*Math.sin(frame*0.05 + i); ctx.globalAlpha = a; circ(x,y,2,'#8fe7ff'); ctx.globalAlpha = 1; }
  } else if (theme === 'sky') {

    circ(720 - cx*0.03, 300, 70, '#ffe9a8'); circ(720 - cx*0.03, 300, 56, '#fff4cf');
    for (let i=-1;i<6;i++) { const x = ((i*260 - cx*0.2) % 1560 + 1560) % 1560 - 200, y = 120 + (i*71 % 120);
      ctx.globalAlpha = 0.85; ell(x,y,70,22,'#ffe4f0'); ell(x+40,y-14,40,24,'#fff1f7'); ctx.globalAlpha = 1; }
    for (let i=-1;i<6;i++) { const x = ((i*340 - cx*0.45) % 2040 + 2040) % 2040 - 300;
      ell(x, 470, 120, 40, '#ffeef6'); ell(x+90, 455, 80, 40, '#fff6fa'); }
  } else {
    g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#14040a'); g.addColorStop(1,'#5a1410'); rect(0,0,W,H,g);
    for (let i=0;i<10;i++) { const x = ((i*170 - cx*0.35) % 1700 + 1700) % 1700 - 150;
      rect(x, 80, 60, H, '#2a0d12'); rect(x-8, 70, 76, 16, '#33111a');

    g = ctx.createLinearGradient(0,H-120,0,H); g.addColorStop(0,'rgba(255,90,20,0)'); g.addColorStop(1,'rgba(255,90,20,0.45)'); rect(0,H-120,W,120,g);

function hills(off, base, amp, col, k){
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0,H);
  for (let x=0;x<=W;x+=8) ctx.lineTo(x, base - (Math.sin((x+off)*k)*amp + Math.sin((x+off)*k*2.7)*amp*0.4) - amp);
  ctx.lineTo(W,H); ctx.fill();
}

function drawTile(v, tx, ty, px, py){
  switch (v) {
    case 1: {
      rect(px,py,TS,TS,TH.ground);
      const h = hash(tx,ty); ctx.fillStyle = TH.groundDark;
      ctx.fillRect(px + (h%20) + 4, py + ((h>>5)%18) + 8, 4, 4); ctx.fillRect(px + ((h>>9)%22) + 2, py + ((h>>14)%16) + 12, 3, 3);
      if (ty > 0 && !SOLID[G(L,tx,ty-1)]) {
        rect(px,py,TS,8,TH.grass); rect(px,py+8,TS,3,TH.grassDark);
        for (let k=0;k<4;k++) if ((h>>(k+3))&1) rect(px+k*8+2, py-3, 3, 3, TH.grass);
      }
      break; }
    case 2: case 14: {
      rect(px,py,TS,TS,TH.brick); rect(px,py,TS,2,TH.brickHi);
      ctx.fillStyle = TH.brickLine;
      ctx.fillRect(px,py+15,TS,2); ctx.fillRect(px,py+30,TS,2);
      ctx.fillRect(px+10,py,2,15); ctx.fillRect(px+26,py,2,15); ctx.fillRect(px+2,py+17,2,13); ctx.fillRect(px+18,py+17,2,13);
      break; }
    case 3: case 4: case 13: {
      rect(px,py,TS,TS,'#0b5d63'); rect(px+2,py+2,TS-4,TS-4,'#1fb5a8'); rect(px+2,py+2,TS-4,3,'#6fe8d8');
      const s = 7 + Math.sin(frame*0.12)*2;
      ctx.fillStyle = '#fff6a8'; ctx.beginPath(); ctx.moveTo(px+16,py+16-s-2); ctx.lineTo(px+16+s,py+16); ctx.lineTo(px+16,py+16+s+2); ctx.lineTo(px+16-s,py+16); ctx.fill();
      rect(px+15,py+12,2,8,'#ffffff');
      rect(px+4,py+4,2,2,'#0b5d63'); rect(px+26,py+4,2,2,'#0b5d63'); rect(px+4,py+26,2,2,'#0b5d63'); rect(px+26,py+26,2,2,'#0b5d63');
      break; }
    case 5: rect(px,py,TS,TS,'#3e3026'); rect(px+2,py+2,TS-4,TS-4,'#7b6250');
      rect(px+5,py+5,3,3,'#3e3026'); rect(px+24,py+5,3,3,'#3e3026'); rect(px+5,py+24,3,3,'#3e3026'); rect(px+24,py+24,3,3,'#3e3026'); break;
    case 6: rect(px,py,TS,TS,'rgba(0,0,0,.45)'); rect(px,py,TS-3,TS-3,TH.stone); rect(px,py,TS-3,3,'rgba(255,255,255,.35)'); rect(px,py,3,TS-3,'rgba(255,255,255,.2)');
      rect(px+3,py+TS-6,TS-6,3,'rgba(0,0,0,.2)'); break;
    case 7: {
      const left = G(L,tx-1,ty) !== 7, cap = G(L,tx,ty-1) !== 7;
      rect(px,py,TS,TS,'#2fb59a');
      if (left) { rect(px+4,py,6,TS,'#7ff0d6'); rect(px,py,3,TS,'#11564a'); } else { rect(px+TS-8,py,5,TS,'#1d7e6b'); rect(px+TS-3,py,3,TS,'#11564a'); }
      if (cap) { rect(left?px-3:px, py, TS+3, 12, '#4fd8b8'); rect(left?px-3:px, py, TS+3, 3, '#a8ffe9'); rect(left?px-3:px, py+12, TS+3, 3, '#11564a'); }
      break; }
    case 9: {
      rect(px,py,TS,TS,'#ff5a1f');
      if (G(L,tx,ty-1) !== 9) { for (let k=0;k<4;k++) { const o = Math.sin(frame*0.1 + (tx*4+k)*0.9)*3; rect(px+k*8, py+o, 8, 8, '#ffb02e'); } }
      else rect(px + (hash(tx,ty)%20), py+10 + Math.sin(frame*0.05+tx)*4, 6, 4, '#ff8a1f');
      break; }
    case 12: {

      ell(px+16,py+16,w,12,'#b8860b'); ell(px+16,py+16,Math.max(w-3,1),9,'#ffd23f'); rect(px+15,py+9,2,14,'#fff3a0');
      break; }
  }
}

function drawTiles(){
  const c0 = Math.floor(camX/TS) - 1, c1 = c0 + Math.ceil(W/TS) + 2;
  for (let ty=0; ty<ROWS; ty++) for (let tx=c0; tx<=c1; tx++) {
    const v = G(L,tx,ty); if (!v) continue;
    let py = ty*TS; const b = bumps.find(b => b.tx === tx && b.ty === ty); if (b) py -= Math.sin(b.t/10*Math.PI)*8;
    drawTile(v, tx, ty, tx*TS, py);
  }
}

function drawHero(px, py, face, size, anim, air, scl=1){
  // Avatar: محمد توفيق — short dark curly hair, navy zip-collar sweater, light-blue jeans
  ctx.save(); ctx.translate(px,py); ctx.scale(face*scl, scl);
  const big = size > 0, legH = big ? 16 : 7, bodyH = big ? 20 : 9, headH = big ? 17 : 14, headW = big ? 16 : 15;
  const bodyTop = -legH - bodyH, headTop = bodyTop - headH + 1;
  const sweater = size === 2 ? '#c0392b' : '#1f2a5c', sweaterDark = size === 2 ? '#8e2219' : '#141c42', sweaterHi = size === 2 ? '#e0574a' : '#2e3d7a';
  const skin = '#e2ad86', skinDark = '#c48c66', hair = '#1c1410';
  const sw = air ? 3 : Math.sin(anim*0.3)*4;
  // legs (jeans) + sneakers
  rect(-6+sw, -legH, 6, legH, '#86acd8'); rect(0-sw, -legH, 6, legH, '#7099c9');
  rect(-5+sw, -legH, 1, legH, '#a9c6e8');
  rect(-7+sw, -3, 8, 3, '#2b2b2b'); rect(-1-sw, -3, 9, 3, '#2b2b2b');
  // back arm
  const arm = air ? -5 : -sw*0.7;
  rect(-2-arm, bodyTop+3, 5, big?13:6, sweaterDark);
  // sweater body with stripes
  rect(-8, bodyTop, 16, bodyH, sweater);
  for (let yy = bodyTop+4; yy < -legH-1; yy += big ? 5 : 4) rect(-8, yy, 16, 1, sweaterDark);
  rect(-8, -legH-2, 16, 2, sweaterDark);
  // collar + zipper
  rect(-5, bodyTop-1, 10, 3, sweaterHi); rect(1, bodyTop, 1, big ? 8 : 4, '#c9cdd6');
  // front arm + hand
  rect(-2+arm, bodyTop+3, 5, big?13:6, sweaterHi);
  rect(-2+arm, bodyTop+3+(big?13:6), 5, 3, skin);
  // neck
  rect(-2, bodyTop-3, 5, 3, skinDark);
  // head
  rect(-headW/2, headTop, headW, headH-2, skin);
  rect(-headW/2-2, headTop+5, 3, 4, skinDark);                 // ear
  rect(headW/2-1, headTop+6, 3, 4, skin);                       // nose
  // hair: short & curly
  rect(-headW/2-1, headTop-3, headW+1, 5, hair);
  rect(-headW/2-1, headTop+1, 4, 4, hair);
  for (let i=0;i<5;i++) circ(-headW/2+1+i*3.4, headTop-3, 2.2, hair);
  // eyebrow, eye, smile
  rect(headW/2-7, headTop+5, 5, 1, '#2a1c14');
  rect(headW/2-6, headTop+7, 3, 3, '#fff'); rect(headW/2-5, headTop+7, 2, 3, '#2a1c14');
  rect(headW/2-6, headTop+headH-6, 5, 1, '#8a4a3a'); rect(headW/2-2, headTop+headH-7, 1, 1, '#8a4a3a');
  ctx.restore();
}
function drawPlayer(){
  if (P.hidden) return;
  if (P.inv > 0 && Math.floor(P.inv/4) % 2 === 0) return;
  let size = P.size;
  if (P.growT > 0 && Math.floor(P.growT/5) % 2 === 0) size = size > 0 ? (size === 2 ? 1 : 0) : 0;
  const dead = state === 'dying';
  ctx.save();
  if (dead) { ctx.translate(Math.round(P.x+P.w/2), Math.round(P.y+P.h/2)); ctx.rotate(Math.PI); ctx.translate(-Math.round(P.x+P.w/2), -Math.round(P.y+P.h/2)); }
  drawHero(Math.round(P.x+P.w/2), Math.round(P.y+P.h), P.face, size, P.anim, !P.onGround);
  ctx.restore();
}

function drawEnemy(e){
  const cx = e.x + e.w/2, by = e.y + e.h;
  ctx.save();
  if (e.state === 'flip') { ctx.translate(cx, e.y+e.h/2); ctx.scale(1,-1); ctx.translate(-cx, -(e.y+e.h/2)); }
  const look = (e.dir || -1) * 2;
  switch (e.type) {
    case 'walker':
      if (e.state === 'squash') { ell(cx, by-4, 17, 5, '#2f9c3e'); ell(cx, by-5, 14, 3, '#43c856'); break; }
      { const wob = Math.sin(frame*0.25 + e.x*0.1)*1.5;
        ctx.fillStyle = '#2f9c3e'; ctx.beginPath(); ctx.ellipse(cx, by-11, 15+wob, 15-wob, 0, Math.PI, 0); ctx.lineTo(cx+15+wob, by); ctx.lineTo(cx-15-wob, by); ctx.fill();
        ctx.fillStyle = '#43c856'; ctx.beginPath(); ctx.ellipse(cx, by-11, 12+wob, 12-wob, 0, Math.PI, 0); ctx.lineTo(cx+12+wob, by-2); ctx.lineTo(cx-12-wob, by-2); ctx.fill();
        ell(cx-6, by-19, 4, 3, '#b8f5c0');
        ell(cx-5, by-12, 4, 5, '#fff'); ell(cx+5, by-12, 4, 5, '#fff');
        rect(cx-6+look, by-13, 3, 4, '#111'); rect(cx+4+look, by-13, 3, 4, '#111'); }
      break;
    case 'spiky':
      for (let i=0;i<3;i++) tri(cx-12+i*9, by-12, cx-7+i*9, by-30, cx-2+i*9, by-12, '#f4f0e6');
      ctx.fillStyle = '#c42f3a'; ctx.beginPath(); ctx.ellipse(cx, by-8, 15, 16, 0, Math.PI, 0); ctx.fill();
      ell(cx-5, by-16, 4, 3, '#ff7a85');
      rect(cx-14, by-8, 28, 4, '#7a1a22');
      { const st = Math.sin(frame*0.3)*2; rect(cx-11+st, by-4, 7, 4, '#ffcc80'); rect(cx+4-st, by-4, 7, 4, '#ffcc80'); }
      rect(cx+look*4-2, by-12, 4, 3, '#111');
      break;
    case 'hopper':
      if (e.state === 'squash') { ell(cx, by-4, 16, 5, '#e0a820'); break; }
      { const air = !e.onGround, stretch = air ? 3 : 0;
        ell(cx, by-10-stretch, 13, 11+stretch, '#f2c230'); ell(cx, by-7-stretch, 8, 6, '#fff0b0');
        circ(cx-7, by-20-stretch*2, 5, '#f2c230'); circ(cx+7, by-20-stretch*2, 5, '#f2c230');
        circ(cx-7, by-21-stretch*2, 3.5, '#fff'); circ(cx+7, by-21-stretch*2, 3.5, '#fff');
        rect(cx-8+look*0.5, by-22-stretch*2, 2, 3, '#111'); rect(cx+6+look*0.5, by-22-stretch*2, 2, 3, '#111');
        if (air) { rect(cx-14, by-4, 6, 6, '#d9a020'); rect(cx+8, by-4, 6, 6, '#d9a020'); }
        else { rect(cx-15, by-3, 8, 3, '#d9a020'); rect(cx+7, by-3, 8, 3, '#d9a020'); } }
      break;
    case 'flyer':
      if (e.state === 'squash') { ell(cx, by-3, 14, 4, '#5a33a8'); break; }
      { const f = Math.sin(frame*0.4)*8, cy = e.y + 10;
        tri(cx-6, cy, cx-24, cy-6-f, cx-20, cy+8, '#4a2a8c'); tri(cx+6, cy, cx+24, cy-6-f, cx+20, cy+8, '#4a2a8c');
        circ(cx, cy, 10, '#7a4bd6'); tri(cx-8, cy-6, cx-5, cy-16, cx-2, cy-8, '#7a4bd6'); tri(cx+8, cy-6, cx+5, cy-16, cx+2, cy-8, '#7a4bd6');
        rect(cx-6, cy-3, 4, 4, '#ffe14d'); rect(cx+2, cy-3, 4, 4, '#ffe14d'); rect(cx-3, cy+4, 2, 3, '#fff'); rect(cx+1, cy+4, 2, 3, '#fff'); }
      break;
  }
  ctx.restore();
}

    case 'flame': {

      ctx.fillStyle = '#ff6a1f'; ctx.beginPath(); ctx.moveTo(cx, cy-15*s); ctx.lineTo(cx+11, cy); ctx.lineTo(cx, cy+14); ctx.lineTo(cx-11, cy); ctx.fill();
      ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.moveTo(cx, cy-8*s); ctx.lineTo(cx+5, cy); ctx.lineTo(cx, cy+7); ctx.lineTo(cx-5, cy); ctx.fill();
      break; }
    case 'heart': {
      const cx = e.x+12, cy = e.y+10;
      circ(cx-5, cy, 6, '#2ecc71'); circ(cx+5, cy, 6, '#2ecc71'); tri(cx-11, cy+2, cx+11, cy+2, cx, cy+13, '#2ecc71'); circ(cx-6, cy-2, 2, '#c8ffd8');

    case 'spring': {

      rect(e.x+2, e.y+28, 28, 4, '#444');
      ctx.strokeStyle = '#d0d4dc'; ctx.lineWidth = 3; ctx.beginPath();
      const n = 4, hh = (e.y + 28 - top - 4) / n;
      ctx.moveTo(e.x+16, e.y+28); for (let i=0;i<n;i++) ctx.lineTo(e.x + (i%2 ? 6 : 26), e.y + 28 - (i+0.5)*hh); ctx.lineTo(e.x+16, top+4); ctx.stroke();
      rect(e.x, top, 32, 6, '#e8213f'); rect(e.x, top, 32, 2, '#ff8a9a');
      break; }
    case 'plat': {
      if (L.theme === 'sky') { ell(e.x+48, e.y+8, 50, 11, '#e9eefb'); ell(e.x+30, e.y+3, 22, 9, '#fff'); ell(e.x+64, e.y+3, 24, 10, '#fff'); }
      else { rect(e.x, e.y, e.w, e.h, TH.plat); rect(e.x, e.y, e.w, 3, 'rgba(255,255,255,.35)'); rect(e.x, e.y+e.h-3, e.w, 3, 'rgba(0,0,0,.3)');
        for (let i=0;i<3;i++) rect(e.x+12+i*32, e.y+6, 4, 4, 'rgba(0,0,0,.35)'); }
      break; }
    case 'firebar':
      for (let i=0;i<e.len;i++) { const bx = e.cx + Math.cos(e.a)*i*14, by = e.cy + Math.sin(e.a)*i*14;
        circ(bx, by, 7, '#ff5a1f'); circ(bx, by, 4, '#ffe14d'); }
      break;
    case 'efire': {
      const s = 7 + Math.sin(frame*0.5)*1.5; circ(e.x+7, e.y+7, s+2, '#c41a1a'); circ(e.x+7, e.y+7, s, '#ff6a1f'); circ(e.x+7, e.y+7, s-3, '#ffe14d');
      break; }
    case 'flagc': {
      rect(e.x+6, e.y, 4, 64, '#ddd'); circ(e.x+8, e.y, 4, '#ffd23f');
      const c = e.got ? '#2ecc71' : '#e8213f', w = Math.sin(frame*0.15)*3;
      tri(e.x+10, e.y+4, e.x+34, e.y+12+w, e.x+10, e.y+20, c);
      break; }
    case 'goal': {
      rect(e.x-6, 13*TS, 18, TS, '#555'); rect(e.x-6, 13*TS, 18, 4, '#888');
      rect(e.x, e.y, 6, e.h - TS, '#d8e0e8'); rect(e.x+4, e.y, 2, e.h - TS, '#9aa6b2');
      circ(e.x+3, e.y-4, 8, '#ffd23f'); circ(e.x+1, e.y-6, 3, '#fff8c8');
      const w = Math.sin(frame*0.15)*4;
      ctx.fillStyle = '#2ecc71'; ctx.beginPath(); ctx.moveTo(e.x, e.flagY); ctx.lineTo(e.x-44, e.flagY+14+w); ctx.lineTo(e.x, e.flagY+30); ctx.fill();
      circ(e.x-14, e.flagY+15, 6, '#fff'); circ(e.x-14, e.flagY+15, 3, '#ff8a2a');
      break; }
  }
}

function drawCastle(x){
  const y = 14*TS, w = 5*TS, h = 5*TS;
  rect(x, y-h, w, h, '#8a7f74'); rect(x, y-h, w, 4, '#b5aa9f');
  for (let i=0;i<5;i++) rect(x + i*TS + 4, y-h-20, 24, 20, '#8a7f74');
  rect(x+TS, y-h-90, 3*TS, 70, '#9a8f84'); for (let i=0;i<3;i++) rect(x+TS+i*TS+4, y-h-108, 24, 18, '#9a8f84');
  ctx.fillStyle = 'rgba(0,0,0,.18)'; for (let r=0;r<5;r++) for (let c=0;c<5;c++) ctx.fillRect(x + c*TS + (r%2)*16, y - h + r*TS + 30, 14, 2);
  rect(x+2*TS+4, y-56, 24, 56, '#2a1a12'); circ(x+2.5*TS, y-56, 12, '#2a1a12');
  rect(x+TS+20, y-h-70, 14, 20, '#2a1a12'); rect(x+3*TS-2, y-h-70, 14, 20, '#2a1a12');
  rect(x+2.5*TS-1, y-h-150, 3, 44, '#ddd'); tri(x+2.5*TS+2, y-h-150, x+2.5*TS+26, y-h-142, x+2.5*TS+2, y-h-134, '#ff8a2a');
}

function drawHUD(){
  rect(0,0,W,40,'rgba(0,0,0,.35)');
  const items = [
    ['النقاط', String(score).padStart(6,'0')],
    ['العملات', '× ' + String(coins).padStart(2,'0')],
    ['المرحلة', L ? L.name.split(' ')[0] : '1-1'],
    ['الوقت', String(Math.max(0,time)).padStart(3,'0')],
    ['الأرواح', '× ' + lives],
  ];
  items.forEach(([a,b],i) => {
    const x = W - (i+0.5)*(W/5);
    txt(a + '  ' + b, x, 21, 18, (a === 'الوقت' && time <= 60 && frame % 30 < 15) ? '#ff6b6b' : '#fff');
  });
  if (muted) txt('🔇', 24, 60, 18, '#fff', 'center');
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  if (state === 'title') return drawTitle();
  if (state === 'intro') {
    rect(0,0,W,H,'#000'); drawHUD();
    txt(L.name, W/2, H/2 - 40, 44, '#ffd23f');
    drawHero(W/2 + 40, H/2 + 50, 1, pSize, 0, false, 2);
    txt('×  ' + lives, W/2 - 30, H/2 + 30, 30);
    return;
  }
  if (state === 'gameover') { rect(0,0,W,H,'#000'); drawHUD(); txt('انتهت اللعبة', W/2, H/2-20, 56, '#ff5a5a');
    if (stateT <= 0 && frame % 60 < 40) txt(T_BACK(), W/2, H/2+50, 22); return; }
  const sx = shake > 0 ? (Math.random()-0.5)*shake*0.8 : 0, sy = shake > 0 ? (Math.random()-0.5)*shake*0.8 : 0;
  ctx.setTransform(1,0,0,1,sx,sy);
  drawBG(L.theme, camX);
  ctx.save(); ctx.translate(-Math.round(camX), 0);
  if (L.castleX != null) drawCastle(L.castleX);
  for (const e of ents) if (e.type === 'plat' || e.type === 'goal' || e.type === 'flagc' || e.type === 'spring') drawItem(e);
  for (const e of ents) if ((e.type === 'fruit' || e.type === 'flame' || e.type === 'heart') && e.rise > 0) drawItem(e);
  drawTiles();
  for (const e of ents) {
    if (e.dormant && e.type !== 'boss') continue;
    if (ENEMY[e.type]) drawEnemy(e);
    else if (e.type === 'boss') drawBoss(e);
    else if (e.type === 'firebar' || e.type === 'efire' || ((e.type === 'fruit' || e.type === 'flame' || e.type === 'heart') && !(e.rise > 0))) drawItem(e);
  }
  drawPlayer();
  for (const f of fbs) { ctx.save(); ctx.translate(f.x+5, f.y+5); ctx.rotate(f.spin); circ(0,0,6,'#ff5a1f'); rect(-2,-5,4,10,'#ffe14d'); rect(-5,-2,10,4,'#ffe14d'); ctx.restore(); }
  for (const p of parts) {
    if (p.kind === 'coin') { const w = Math.abs(Math.cos(p.life*0.5))*8+2; ell(p.x, p.y, w, 11, '#b8860b'); ell(p.x, p.y, Math.max(w-3,1), 8, '#ffd23f'); }
    else { ctx.globalAlpha = Math.min(1, p.life/15); rect(p.x - p.size/2, p.y - p.size/2, p.size, p.size, p.col); if (p.rot) rect(p.x-p.size/2, p.y-1, p.size, 2, TH.brickLine); ctx.globalAlpha = 1; }
  }
  for (const f of floats) txt(f.text, f.x + 12, f.y, 16, f.text === '1UP' ? '#5cff7a' : '#fff');
  ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);
  drawHUD();
  if (state === 'paused') { rect(0,0,W,H,'rgba(0,0,0,.55)'); txt('إيقاف مؤقت', W/2, H/2-10, 52, '#ffd23f'); txt(T_RESUME(), W/2, H/2+45, 20); }
  if (state === 'clear' && clearPhase === 2) txt('أحسنت! المرحلة اكتملت', W/2, 130, 36, '#ffd23f');
  if (state === 'win') {
    rect(0,0,W,H,'rgba(0,0,0,' + Math.min(0.7, (90 - stateT)/90*0.7) + ')');
    txt('مبروك يا أمير محمد توفيق! أنقذت الأميرة', W/2, H/2 - 70, 46, '#ffd23f');
    txt('النقاط النهائية: ' + score, W/2, H/2, 30);
    drawHero(W/2, H/2 + 110, 1, 2, frame, false, 2);
    if (stateT <= 0 && frame % 60 < 40) txt(T_AGAIN(), W/2, H - 40, 22);
  }
}

function drawTitle(){
  drawBG('meadow', frame*1.2);
  for (let x=-(frame*1.2 % TS); x<W; x+=TS) { rect(x, 14*TS, TS, 2*TS, THEMES.meadow.ground); rect(x, 14*TS, TS, 8, THEMES.meadow.grass); rect(x, 14*TS+8, TS, 3, THEMES.meadow.grassDark); }
  rect(W/2-330, 50, 660, 120, 'rgba(0,0,0,.35)');
  txt('رحلة الأمير محمد توفيق', W/2, 92, 58, '#ffd23f', 'center', '#5a2a0a');
  txt('لإنقاذ الأميرة', W/2, 148, 32, '#ffb3d1', 'center', '#5a2a0a');
  drawHero(W/2, 14*TS, 1, 1, frame*3, false, 2.5);
  const lines = TOUCH ? ['◀ ▶  للحركة  (اسحب للطرف علشان تجري)', 'A  للقفز      B  للجري وإطلاق النار', '❚❚  إيقاف مؤقت'] : ['← →  للحركة      Z / مسافة / ↑  للقفز', 'X / Shift  للجري  (وإطلاق النار بعد بلّورة النار)', 'P  إيقاف مؤقت      M  كتم الصوت'];
  lines.forEach((l,i) => txt(l, W/2, 192 + i*27, 19, '#fff'));
  if (frame % 60 < 42) txt(T_START(), W/2, 283, 28, '#ffffff', 'center', '#b0401a');
}

// ================= Main loop =================
let last = performance.now(), acc = 0;
function loop(now){
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000/60) { update(); acc -= 1000/60; }
  musTick();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
